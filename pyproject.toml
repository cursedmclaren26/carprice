[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carprice"
version = "1.0.0"
description = "Used-car price prediction: cleaning, modelling and a small web app"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
eda = ["matplotlib>=3.7", "seaborn>=0.13"]
web = ["flask>=3.0"]
dev = ["nbformat>=5.9", "nbclient>=0.10", "jupyter-client>=8.0", "ipykernel>=6.25"]

[project.scripts]
carvalue = "carprice.carvalue:main"

[tool.setuptools.packages.find]
where = ["src"]
