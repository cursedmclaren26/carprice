services:
  - type: web
    name: car-price-predictor
    env: python
    region: singapore          # closest free region to India
    plan: free
    buildCommand: pip install -r requirements-prod.txt && pip install -e .
    startCommand: gunicorn wsgi:app --workers 2 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

