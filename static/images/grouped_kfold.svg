  <rect width="700" height="350" fill="#11161d" rx="12"/>
  <text x="350" y="30" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Grouped K-Fold Cross-Validation</text>
  <text x="350" y="340" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">Prevents sibling models (e.g. Swift variants) from leaking into validation</text>
  <rect x="90" y="70" width="432" height="36" rx="4" fill="#1f6feb" opacity="0.75"/><text x="306" y="93" font-family="system-ui,sans-serif" font-size="10" fill="#f0f6fc" text-anchor="middle">TRAIN</text><rect x="522" y="70" width="108" height="36" rx="4" fill="#d29922"/><text x="576" y="93" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#11161d" text-anchor="middle">VAL</text><text x="78" y="93" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e" text-anchor="end">Fold 1</text><rect x="90" y="118" width="324" height="36" rx="4" fill="#1f6feb" opacity="0.75"/><text x="252" y="141" font-family="system-ui,sans-serif" font-size="10" fill="#f0f6fc" text-anchor="middle">TRAIN</text><rect x="522" y="118" width="108" height="36" rx="4" fill="#1f6feb" opacity="0.75"/><text x="576" y="141" font-family="system-ui,sans-serif" font-size="10" fill="#f0f6fc" text-anchor="middle">TRAIN</text><rect x="414" y="118" width="108" height="36" rx="4" fill="#d29922"/><text x="468" y="141" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#11161d" text-anchor="middle">VAL</text><text x="78" y="141" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e" text-anchor="end">Fold 2</text><rect x="90" y="166" width="216" height="36" rx="4" fill="#1f6feb" opacity="0.75"/><text x="198" y="189" font-family="system-ui,sans-serif" font-size="10" fill="#f0f6fc" text-anchor="middle">TRAIN</text><rect x="414" y="166" width="216" height="36" rx="4" fill="#1f6feb" opacity="0.75"/><text x="522" y="189" font-family="system-ui,sans-serif" font-size="10" fill="#f0f6fc" text-anchor="middle">TRAIN</text><rect x="306" y="166" width="108" height="36" rx="4" fill="#d29922"/><text x="360" y="189" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#11161d" text-anchor="middle">VAL</text><text x="78" y="189" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e" text-anchor="end">Fold 3</text><rect x="90" y="214" width="108" height="36" rx="4" fill="#1f6feb" opacity="0.75"/><text x="144" y="237" font-family="system-ui,sans-serif" font-size="10" fill="#f0f6fc" text-anchor="middle">TRAIN</text><rect x="306" y="214" width="324" height="36" rx="4" fill="#1f6feb" opacity="0.75"/><text x="468" y="237" font-family="system-ui,sans-serif" font-size="10" fill="#f0f6fc" text-anchor="middle">TRAIN</text><rect x="198" y="214" width="108" height="36" rx="4" fill="#d29922"/><text x="252" y="237" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#11161d" text-anchor="middle">VAL</text><text x="78" y="237" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e" text-anchor="end">Fold 4</text><rect x="198" y="262" width="432" height="36" rx="4" fill="#1f6feb" opacity="0.75"/><text x="414" y="285" font-family="system-ui,sans-serif" font-size="10" fill="#f0f6fc" text-anchor="middle">TRAIN</text><rect x="90" y="262" width="108" height="36" rx="4" fill="#d29922"/><text x="144" y="285" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#11161d" text-anchor="middle">VAL</text><text x="78" y="285" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e" text-anchor="end">Fold 5</text>
  <!-- Annotation -->
  <rect x="90" y="285" width="450" height="28" rx="6" fill="#1a2332" stroke="#30363d" stroke-width="1"/>
  <text x="315" y="302" font-family="system-ui,sans-serif" font-size="10" fill="#d29922" text-anchor="middle">Models in same group always stay in same fold — prevents data leakage</text>
  <!-- Score formula -->
  <text x="350" y="325" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Final Score = mean(fold scores) ± std</text>
