<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#11161d" rx="14" stroke="#262d38" stroke-width="1.5"/>
  <text x="450" y="32" fill="#539bf5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">DOMAIN-SPECIFIC MISSING VALUE IMPUTATION STRATEGY</text>
  
  <rect x="50" y="55" width="370" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="235" y="85" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Numerical Features</text>
  <text x="235" y="110" fill="#539bf5" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">SimpleImputer(strategy='median')</text>
  <text x="235" y="135" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Engine CC, Max Power (bhp), Mileage (kmpl)</text>
  <text x="235" y="155" fill="#3fb950" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">✓ Robust against extreme luxury/sports car skew</text>
  
  <rect x="480" y="55" width="370" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="665" y="85" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Categorical Features</text>
  <text x="665" y="110" fill="#539bf5" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">SimpleImputer(strategy='most_frequent')</text>
  <text x="665" y="135" fill="#8b949e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Fuel Type, Transmission, Seller Type, Owner</text>
  <text x="665" y="155" fill="#3fb950" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">✓ Preserves manufacturer model frequency mode</text>
</svg>