<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 700 420">
  <rect width="700" height="420" fill="#11161d" rx="12"/>
  <text x="350" y="30" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Model Benchmarking — 5-Fold GridSearchCV (9 Reduced Features)</text>
  <text x="350" y="408" font-family="system-ui,sans-serif" font-size="9.5" fill="#8b949e" text-anchor="middle">Higher CV &amp; Test R² + Lower MAPE = Better · SVR (RBF, C=10, auto) wins 5-Fold CV (84.45%)</text>
  <line x1="65" y1="320" x2="645" y2="320" stroke="#30363d" stroke-width="1.5"/>
  <line x1="65" y1="120" x2="645" y2="120" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="65" y1="220" x2="645" y2="220" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Old HistGB (Before) -->
  <rect x="80" y="164" width="44" height="156" rx="4" fill="#6e7681" opacity="0.85"/>
  <text x="102" y="158" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">86.4%</text>
  <rect x="132" y="255" width="44" height="65" rx="4" fill="#d29922" opacity="0.7"/>
  <text x="154" y="249" font-family="system-ui,sans-serif" font-size="10" fill="#d29922" text-anchor="middle">20.2%</text>
  <text x="128" y="340" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Old HistGB (12F)</text>
  <text x="128" y="354" font-family="system-ui,sans-serif" font-size="8.5" fill="#8b949e" text-anchor="middle">CV 79.5%</text>

  <!-- KNN -->
  <rect x="220" y="159" width="44" height="161" rx="4" fill="#539bf5" opacity="0.85"/>
  <text x="242" y="153" font-family="system-ui,sans-serif" font-size="10" fill="#539bf5" text-anchor="middle">89.5%</text>
  <rect x="272" y="258" width="44" height="62" rx="4" fill="#d29922" opacity="0.85"/>
  <text x="294" y="252" font-family="system-ui,sans-serif" font-size="10" fill="#d29922" text-anchor="middle">19.2%</text>
  <text x="268" y="340" font-family="system-ui,sans-serif" font-size="10" fill="#f0f6fc" text-anchor="middle">KNN (Rank #3)</text>
  <text x="268" y="354" font-family="system-ui,sans-serif" font-size="8.5" fill="#8b949e" text-anchor="middle">CV 82.85%</text>

  <!-- Random Forest -->
  <rect x="360" y="154" width="44" height="166" rx="4" fill="#539bf5" opacity="0.9"/>
  <text x="382" y="148" font-family="system-ui,sans-serif" font-size="10" fill="#539bf5" text-anchor="middle">92.3%</text>
  <rect x="412" y="261" width="44" height="59" rx="4" fill="#d29922" opacity="0.85"/>
  <text x="434" y="255" font-family="system-ui,sans-serif" font-size="10" fill="#d29922" text-anchor="middle">18.5%</text>
  <text x="408" y="340" font-family="system-ui,sans-serif" font-size="10" fill="#f0f6fc" text-anchor="middle">Random Forest (#2)</text>
  <text x="408" y="354" font-family="system-ui,sans-serif" font-size="8.5" fill="#8b949e" text-anchor="middle">CV 83.12%</text>

  <!-- SVR Winner -->
  <rect x="500" y="156" width="44" height="164" rx="4" fill="#3fb950"/>
  <text x="522" y="150" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#3fb950" text-anchor="middle">91.1%</text>
  <rect x="552" y="268" width="44" height="52" rx="4" fill="#f0a500"/>
  <text x="574" y="262" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#f0a500" text-anchor="middle">16.3%</text>
  <text x="548" y="340" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#79c0ff" text-anchor="middle">SVM / SVR (#1 ★)</text>
  <text x="548" y="354" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700" fill="#3fb950" text-anchor="middle">CV 84.45%</text>

  <rect x="195" y="372" width="14" height="10" rx="2" fill="#539bf5"/>
  <text x="215" y="381" font-family="system-ui,sans-serif" font-size="11" fill="#f0f6fc">Untouched Test R² %</text>
  <rect x="355" y="372" width="14" height="10" rx="2" fill="#d29922"/>
  <text x="375" y="381" font-family="system-ui,sans-serif" font-size="11" fill="#f0f6fc">Test MAPE % (lower = better)</text>
</svg>