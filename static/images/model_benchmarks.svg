<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 700 420">
  <rect width="700" height="420" fill="#11161d" rx="12"/>
  <text x="350" y="30" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">Model Benchmarking — Tuned 5-Fold GroupKFold Performance</text>
  <text x="350" y="410" font-family="system-ui,sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">Lower MAPE + Higher R² = Better · HistGradientBoostingRegressor is honest CV champion</text>

  <!-- Base line -->
  <line x1="70" y1="320" x2="630" y2="320" stroke="#30363d" stroke-width="1.5"/>
  <!-- Y grid lines -->
  <line x1="70" y1="120" x2="630" y2="120" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="70" y1="220" x2="630" y2="220" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Model 1: Ridge (R2 0.695, MAPE 42.7%) -->
  <rect x="80" y="181" width="48" height="139" rx="4" fill="#539bf5" opacity="0.85"/>
  <text x="104" y="175" font-family="system-ui,sans-serif" font-size="10" fill="#539bf5" text-anchor="middle">0.695</text>
  <rect x="138" y="149" width="48" height="171" rx="4" fill="#d29922" opacity="0.85"/>
  <text x="162" y="143" font-family="system-ui,sans-serif" font-size="10" fill="#d29922" text-anchor="middle">42.7%</text>
  <text x="128" y="340" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Ridge</text>

  <!-- Model 2: Gradient Boosting (R2 0.858, MAPE 24.5%) -->
  <rect x="210" y="148" width="48" height="172" rx="4" fill="#539bf5" opacity="0.85"/>
  <text x="234" y="142" font-family="system-ui,sans-serif" font-size="10" fill="#539bf5" text-anchor="middle">0.858</text>
  <rect x="268" y="222" width="48" height="98" rx="4" fill="#d29922" opacity="0.85"/>
  <text x="292" y="216" font-family="system-ui,sans-serif" font-size="10" fill="#d29922" text-anchor="middle">24.5%</text>
  <text x="258" y="340" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Grad Boost</text>

  <!-- Model 3: Random Forest (R2 0.915, MAPE 20.4%) -->
  <rect x="340" y="137" width="48" height="183" rx="4" fill="#539bf5" opacity="0.85"/>
  <text x="364" y="131" font-family="system-ui,sans-serif" font-size="10" fill="#539bf5" text-anchor="middle">0.915</text>
  <rect x="398" y="238" width="48" height="82" rx="4" fill="#d29922" opacity="0.85"/>
  <text x="422" y="232" font-family="system-ui,sans-serif" font-size="10" fill="#d29922" text-anchor="middle">20.4%</text>
  <text x="388" y="340" font-family="system-ui,sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">Random Forest</text>

  <!-- Model 4: HistGB (R2 0.864, MAPE 20.2%) -->
  <rect x="470" y="147" width="48" height="173" rx="4" fill="#79c0ff" opacity="1"/>
  <text x="494" y="141" font-family="system-ui,sans-serif" font-size="10" fill="#79c0ff" text-anchor="middle">0.864</text>
  <rect x="528" y="239" width="48" height="81" rx="4" fill="#f0a500" opacity="1"/>
  <text x="552" y="233" font-family="system-ui,sans-serif" font-size="10" fill="#f0a500" text-anchor="middle">20.2%</text>
  <text x="518" y="340" font-family="system-ui,sans-serif" font-size="10" fill="#79c0ff" text-anchor="middle">HistGrad Boost</text>
  <text x="518" y="354" font-family="system-ui,sans-serif" font-size="9" fill="#3fb950" text-anchor="middle">★ Champion (CV 0.731)</text>

  <!-- Legend -->
  <rect x="200" y="370" width="14" height="10" rx="2" fill="#539bf5"/>
  <text x="220" y="380" font-family="system-ui,sans-serif" font-size="11" fill="#f0f6fc">Test R² Score</text>
  <rect x="310" y="370" width="14" height="10" rx="2" fill="#d29922"/>
  <text x="330" y="380" font-family="system-ui,sans-serif" font-size="11" fill="#f0f6fc">Test MAPE %</text>
</svg>
