<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#11161d" rx="14" stroke="#262d38" stroke-width="1.5"/>
  <text x="450" y="32" fill="#539bf5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">IQR STATISTICAL BOUNDARY CAPPING METHODOLOGY</text>
  
  <line x1="80" y1="130" x2="820" y2="130" stroke="#30363d" stroke-width="2"/>
  
  <line x1="160" y1="100" x2="160" y2="160" stroke="#f85149" stroke-width="2.5" stroke-dasharray="4"/>
  <text x="160" y="85" fill="#f85149" font-family="monospace" font-size="12" text-anchor="middle">Lower Fence (Q1 - 1.5*IQR)</text>
  
  <rect x="300" y="80" width="300" height="100" fill="#161b22" stroke="#539bf5" stroke-width="2" rx="4"/>
  <line x1="430" y1="80" x2="430" y2="180" stroke="#3fb950" stroke-width="2.5"/>
  <text x="300" y="205" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="middle">Q1 (25th %)</text>
  <text x="430" y="205" fill="#3fb950" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Median</text>
  <text x="600" y="205" fill="#8b949e" font-family="monospace" font-size="12" text-anchor="middle">Q3 (75th %)</text>
  
  <line x1="740" y1="100" x2="740" y2="160" stroke="#f85149" stroke-width="2.5" stroke-dasharray="4"/>
  <text x="740" y="85" fill="#f85149" font-family="monospace" font-size="12" text-anchor="middle">Upper Fence (Q3 + 1.5*IQR)</text>
  <text x="780" y="125" fill="#f85149" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Capped at Fence</text>
</svg>