  <rect width="100%" height="100%" fill="#11161d" rx="14" stroke="#262d38" stroke-width="1.5"/>
  <text x="450" y="32" fill="#539bf5" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">TRAIN-TEST PARTITION &amp; 5-FOLD CROSS VALIDATION</text>
  
